<div class="appearance-settings">
  <h3>Appearance</h3>

  <mat-button-toggle-group name="theme-mode-toggle-group"
                           class="theme-mode-toggle"
                           [value]="themeService.themeMode()"
                           (change)="onThemeModeChange($event)">
    @for (mode of themeModes(); track mode.label) {
      <mat-button-toggle [value]="mode.mode">
        <span class="material-symbols-outlined">{{mode.icon}}</span>
        <span>{{mode.label}}</span>
      </mat-button-toggle>
    }
  </mat-button-toggle-group>

  <div class="theme-grid">
    @for (theme of themeService.getThemes(); track theme.id) {
      <button
        class="theme-swatch"
        [class.selected]="themeService.currentTheme().id === theme.id"
        (click)="themeService.setTheme(theme.id)"
        [attr.aria-label]="theme.displayName">
        <span class="swatch-color" [style.background-color]="theme.primary"></span>
        @if (themeService.currentTheme().id === theme.id) {
          <span class="check-overlay">
            <span class="material-symbols-outlined">check</span>
          </span>
        }
      </button>
    }
  </div>
</div>
