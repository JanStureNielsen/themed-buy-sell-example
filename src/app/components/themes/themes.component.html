<div class="theme-mode-selector">

  <h4>Theme Mode</h4>
  <mat-button-toggle-group name="theme-mode-toggle-group" [(ngModel)]="themeMode">
    @for (mode of themeModes(); track mode.label) {
      <mat-button-toggle value="{{mode.mode}}" matTooltip="{{mode.label}}">
        <span class="material-symbols-outlined">{{mode.icon}}</span>
        <span>{{mode.label}}</span>
      </mat-button-toggle>
    }
  </mat-button-toggle-group>
  <mat-toolbar>
    <span>Angular Custom Themes</span>
    <button mat-icon-button [matMenuTriggerFor]="themeMenu">
      <mat-icon>format_color_fill</mat-icon>
    </button>
    <mat-menu #themeMenu="matMenu">
      @for (theme of themeService.getThemes(); track theme.id) {
        <button mat-menu-item (click)="themeService.setTheme(theme.id)">
          <div class="theme-menu-item">
            <div
              class="color-preview"
              [style.background-color]="theme.primary"
            ></div>
            <span>{{ theme.displayName }}</span>
          </div>
        </button>
      }
    </mat-menu>
  </mat-toolbar>

</div>
